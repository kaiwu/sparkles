name: Publish Sparkles npm packages

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Select exactly one independent npm package
        required: true
        type: choice
        options:
          - pi
          - dsh
      version:
        description: Exact reviewed package version (never inferred from the other channel)
        required: true
        type: string
      base:
        description: Highest stable version observed in this package's npm history
        required: true
        type: string
      reason:
        description: Required for any departure from this package's next patch version
        required: false
        type: string
      confirmation:
        description: Type publish to authorize the registry mutation
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-sparkles-${{ inputs.lane }}
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.confirmation == 'publish'
    runs-on: ubuntu-24.04
    environment: npm
    env:
      RELEASE_LANE: ${{ inputs.lane }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_BASE: ${{ inputs.base }}
      RELEASE_REASON: ${{ inputs.reason }}
    steps:
      - name: Check out the selected tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Set up Gleam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: false
          gleam-version: 1.18.0
          version-type: strict

      - name: Validate the selected channel, version, baseline, and immutable tag
        run: |
          bun run npm:release:preflight -- "$RELEASE_LANE" --base "$RELEASE_BASE" --version "$RELEASE_VERSION" --reason "$RELEASE_REASON" --ref "$GITHUB_REF"

      - name: Install locked build dependencies
        run: bun install --frozen-lockfile

      - name: Install the selected package's tested host
        run: |
          case "$RELEASE_LANE" in
            pi) npm install --global @earendil-works/pi-coding-agent@0.84.1 ;;
            dsh) npm install --global @deepseek-ai/dsh@0.1.2-rc.1 ;;
            *) exit 1 ;;
          esac

      - name: Test the release procedure
        run: bun run npm:release:procedure:test

      - name: Build and verify the selected T6 release
        shell: bash
        run: |
          case "$RELEASE_LANE" in
            pi) bun run npm:release:verify ;;
            dsh) bun run dsh:npm:release:verify ;;
            *) exit 1 ;;
          esac

      - name: Recheck registry history and the exact locked artifact
        id: tarball
        shell: bash
        run: |
          case "$RELEASE_LANE" in
            pi) release_directory=dist/npm/t6 ;;
            dsh) release_directory=dist/dsh/npm/t6 ;;
            *) exit 1 ;;
          esac
          bun run npm:release:preflight -- "$RELEASE_LANE" --base "$RELEASE_BASE" --version "$RELEASE_VERSION" --reason "$RELEASE_REASON" --ref "$GITHUB_REF" --artifact "$release_directory" > release-preflight.json
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const record = JSON.parse(readFileSync('release-preflight.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `path=${record.tarball}\n`);
          NODE
          printf 'directory=%s\n' "$release_directory" >> "$GITHUB_OUTPUT"

      - name: Retain the reviewed release artifact and registry evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sparkles-${{ inputs.lane }}-${{ inputs.version }}-T6
          path: |
            ${{ steps.tarball.outputs.path }}
            ${{ steps.tarball.outputs.directory }}/npm-pack.json
            ${{ steps.tarball.outputs.directory }}/RELEASE_SHA256SUMS
            release-preflight.json
          if-no-files-found: error

      - name: Publish only the selected package through npm trusted publishing
        env:
          RELEASE_TARBALL: ${{ steps.tarball.outputs.path }}
        run: npm publish "$RELEASE_TARBALL" --tag latest --access public --ignore-scripts

      - name: Verify the selected latest tag
        run: bun run npm:release:latest -- "$RELEASE_LANE" --version "$RELEASE_VERSION" --check
