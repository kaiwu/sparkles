name = "finance_sina"
version = "0.1.0"
target = "javascript"
description = "Bounded Sina Finance mainland daily OHLCV adapter"

licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_authority_snapshot = { path = "../finance_authority_snapshot" }
finance_calendar = { path = "../finance_calendar" }
finance_core = { path = "../finance_core" }
finance_http = { path = "../finance_http" }
finance_track = { path = "../finance_track" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.finance]
status = "experimental"
provider = "Sina Finance public web mainland daily K-line endpoint"
