name = "pi_sparkles_cn_market_data"
version = "0.1.0"
target = "javascript"
description = "Track-isolated Eastmoney mainland tools plus an explicit Sina STAR 50 history alternative for Pi"

licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_cn_identity = { path = "../../finance/finance_cn_identity" }
finance_core = { path = "../../finance/finance_core" }
finance_eastmoney = { path = "../../finance/finance_eastmoney" }
finance_http = { path = "../../finance/finance_http" }
finance_ohlcv = { path = "../../finance/finance_ohlcv" }
finance_provenance = { path = "../../finance/finance_provenance" }
finance_sina = { path = "../../finance/finance_sina" }
finance_track = { path = "../../finance/finance_track" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
provider = "Eastmoney; explicitly selected Sina STAR 50 history alternative"
access = "public web local analysis; rights and service level unknown"
