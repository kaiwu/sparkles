name = "pi_sparkles_company_profile"
version = "0.1.0"
target = "javascript"
description = "Exact US company snapshots from Twelve Data or Equibles for Pi"

licences = ["Apache-2.0"]
gleam = ">= 1.18.0"

[dependencies]
gleam_stdlib = ">= 0.69.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
finance_core = { path = "../../finance/finance_core" }
finance_equibles = { path = "../../finance/finance_equibles" }
finance_http = { path = "../../finance/finance_http" }
finance_provenance = { path = "../../finance/finance_provenance" }
finance_track = { path = "../../finance/finance_track" }
finance_twelve_data = { path = "../../finance/finance_twelve_data" }
pi_gleam = { path = "../../pi_gleam" }

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"

[javascript]
runtime = "bun"

[metadata.pi]
tested_version = "0.83.0"

[metadata.finance]
provider = "Twelve Data or Equibles"
access = "read-only"
track = "us"
